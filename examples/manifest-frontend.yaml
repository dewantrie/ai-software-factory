# Example manifest for a frontend-only Next.js repo.
# Copy to your repo as `.factory.yaml` and edit the values.

name: billing-web
layer: frontend
profile: nextjs-app-router

factory-repo: ../ai-factory
contracts-repo: ../ai-factory-contracts

commands:
  typecheck: pnpm typecheck
  lint: pnpm lint
  test: pnpm test
  acceptance: pnpm test:acceptance

paths:
  frontend:
    - src/app/**
    - src/components/**
    - src/hooks/**
    - src/lib/client/**
  tests:
    - tests/acceptance/**
    - tests/fixtures/**
  forbidden:
    - src/app/api/**        # this repo doesn't own backend
    - .env*
    - "**/secrets.*"

dont-do:
  - Do not call backend APIs directly from server components without going through src/lib/client/api.ts.
  - Image assets must be optimized via next/image, not raw <img>.

platforms:
  - claude-code

notes: |
  This repo consumes the billing-api OpenAPI spec from ai-factory-contracts.
  Run `pnpm generate:api` after pulling new contracts to regenerate typed clients.
