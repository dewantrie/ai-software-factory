# Example manifest for a backend-only Node + Fastify repo.
# Copy to your repo as `.factory.yaml` and edit the values.

name: billing-api
layer: backend
profile: node-fastify

contracts-repo: ../ai-factory-contracts
# factory-repo is intentionally omitted — the global `factory` binary
# already knows where the central checkout lives. Don't bake a
# developer-specific local path into a team-shared manifest.

commands:
  typecheck: pnpm typecheck
  lint: pnpm lint
  test: pnpm test
  acceptance: pnpm test:integration

paths:
  backend:                       # Backend Builder may edit
    - src/routes/**
    - src/services/**
    - src/repository/**
    - src/lib/**
  migrations:                    # Migration Author owns the schema (not the backend builder)
    - prisma/**
  infra:                         # DevOps Builder owns CI/CD + container/IaC
    - Dockerfile
    - docker-compose*.yml
    - .github/workflows/**
  tests:                         # Test Verifier may edit
    - tests/integration/**
    - tests/fixtures/**
  docs:                          # Doc Writer may edit
    - docs/**
    - CHANGELOG.md
    - README.md
  forbidden:                     # no agent may edit
    - .env*
    - "**/secrets.*"

dont-do:
  - Do not call the legacy /v1 endpoints — they're being deprecated.
  - Stripe API version is locked at 2024-06-20.

platforms:
  - claude-code
  - kiro           # generates .kiro/steering/* + .kiro/FACTORY.md
  - codex          # generates AGENTS.md + .codex/agents/* + .codex/orchestrator/*.sh

notes: |
  This repo is the authoritative source for billing API contracts.
  Cross-repo features should land here first; the OpenAPI spec is
  published to the contracts repo on every merge.
