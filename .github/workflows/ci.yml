name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # corepack ships with the runner's Node and reads `packageManager` from
      # package.json, so the pnpm here is the pinned one. It must run before
      # setup-node, which needs pnpm on PATH to resolve its cache.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
